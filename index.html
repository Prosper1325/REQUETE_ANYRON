<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Le Registre ANYRON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --paper:#EFE7D8;
    --paper-light:#FFFFFF;
    --paper-line: rgba(30,42,56,0.08);
    --ink:#1E2A38;
    --ink-soft:#5B6B7A;
    --ink-faint:#8B95A1;
    --green:#3F6B4F;
    --green-soft:#E4ECE6;
    --brass:#A67C3D;
    --brass-soft:#F1E6D3;
    --rouge:#A13D3D;
    --rouge-soft:#F3E3E1;
    --radius:14px;
    --shadow: 0 1px 2px rgba(30,42,56,0.06), 0 6px 20px rgba(30,42,56,0.06);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing:antialiased; }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:-1;
    background-image: url('background.png');
    background-size: cover;
    background-position: center top;
  }
  .app{ width:100%; min-height:100vh; background: rgba(255,255,255,0.45); display:flex; flex-direction:column; position:relative; }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    padding: 32px 26px; background: rgba(30,42,56,0.82); color: var(--paper-light);
  }
  .login-screen .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--brass); margin-bottom:8px; }
  .login-screen h1{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:0 0 6px; }
  .login-screen p.sub{ color:#C9D2DA; font-size:14px; margin:0 0 28px; line-height:1.5; }
  .login-screen .field label{ color:#C9D2DA; }
  .login-screen .field input{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); color:#fff; }
  .login-screen .field input::placeholder{ color:#7C8A98; }
  .login-screen .btn-primary{ background: var(--brass); color: var(--ink); }
  .switch-link{ text-align:center; margin-top:16px; font-size:13px; color:#C9D2DA; }
  .switch-link a{ color: var(--brass); cursor:pointer; text-decoration:underline; }
  .login-error{ background: rgba(161,61,61,0.18); color:#F0B8B8; border:1px solid rgba(161,61,61,0.4); padding:9px 12px; border-radius:10px; font-size:12.5px; margin-bottom:14px; display:none; }
  .login-error.show{ display:block; }

  /* ---------- HEADER ---------- */
  header.cover{ padding: 22px 20px 16px; background: var(--ink); color: var(--paper-light); position:relative; border-bottom: 4px double var(--brass); text-align:center; }
  header.cover .logout{ position:absolute; top:20px; right:18px; font-family:'Inter',sans-serif; font-size:12px; text-transform:none; letter-spacing:0; cursor:pointer; color:#C9D2DA; }
  header.cover .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--brass); margin-bottom:6px; }
  header.cover h1{ font-family:'Fraunces',serif; font-weight:600; font-size:25px; margin:0; letter-spacing:-0.01em; }
  header.cover .userline{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:#C9D2DA; margin-top:4px; }

  nav.tabs{ display:flex; padding: 0 12px; gap: 2px; border-bottom: 1px solid var(--paper-line); background:var(--paper); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ flex:0 0 auto; white-space:nowrap; background:none; border:none; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; color: var(--ink-faint); padding: 10px 12px 12px; cursor:pointer; border-bottom: 3px solid transparent; transition: color .15s; }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--brass); }
  .tab-badge{ display:inline-block; background:var(--rouge); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:4px; vertical-align:2px; }

  main{ flex:1; padding: 18px 20px 100px; }
  section.view{ display:none; }
  section.view.active{ display:block; }

  h2.section-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin: 4px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted{ color: var(--ink-soft); font-size:13px; }
  .back-link{ font-size:13px; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:4px; margin-bottom:10px; }
  .back-link:hover{ color:var(--ink); }

  /* ---------- FAMILY CARDS ---------- */
  .family-grid{ display:flex; flex-direction:column; gap:10px; }
  .family-select-row{ display:flex; gap:8px; align-items:center; }
  .family-select-row select{
    flex:1; font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px; color: var(--ink);
    padding: 13px 14px; border-radius: var(--radius); border: 1.5px solid var(--paper-line);
    background: var(--paper-light); box-shadow: var(--shadow); cursor:pointer;
  }
  .family-select-row .edit-ico-btn{
    flex-shrink:0; width:44px; height:44px; border-radius: var(--radius); border: 1.5px solid var(--paper-line);
    background: var(--paper-light); box-shadow: var(--shadow); color: var(--ink-faint); cursor:pointer; font-size:15px;
  }
  .family-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display:flex; align-items:center; gap:14px; cursor:pointer; border: 1.5px solid transparent; transition: border-color .15s; }
  .family-card:hover{ border-color: var(--brass); }
  .family-card .badge{ width:46px;height:46px;border-radius:50%; background: var(--green-soft); color:var(--green); display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:17px; flex-shrink:0; }
  .family-card .info{ flex:1; min-width:0; }
  .family-card .info .name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; display:flex; align-items:center; gap:6px; }
  .family-card .info .name .edit-ico{ font-size:12px; color:var(--ink-faint); cursor:pointer; }
  .family-card .info .stat{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .family-card .chevron{ color: var(--ink-faint); font-size:18px; }

  /* ---------- SUMMARY STRIP ---------- */
  .summary{ display:flex; padding: 14px 20px 4px; gap:10px; }
  .summary .card{ flex:1; background: var(--paper-light); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .summary .card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .summary .card .value{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin-top:4px; color: var(--ink); }

  /* ---------- FILTER BAR ---------- */
  .filter-bar{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
  .filter-bar select{ font-family:'Inter',sans-serif; font-size:12.5px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--paper-line); background:var(--paper-light); color:var(--ink-soft); flex-shrink:0; }

  /* ---------- LIST GROUP ---------- */
  .list-group{ margin-bottom:16px; }
  .list-group-header{ display:flex; justify-content:space-between; align-items:baseline; padding: 0 2px 8px; }
  .list-group-header .lname{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; }
  .list-group-header .ltotal{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color: var(--ink-soft); }

  .ledger{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
  .ledger-row{ display:flex; align-items:center; gap:12px; padding: 13px 14px; border-bottom: 1px solid var(--paper-line); position:relative; }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-row .who{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:14px; background: var(--brass-soft); color:var(--brass); flex-shrink:0; }
  .ledger-row .info{ flex:1; min-width:0; }
  .ledger-row .info .name{ font-weight:600; font-size:14px; }
  .ledger-row .info .meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--ink-faint); margin-top:2px; }
  .ledger-row .amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14.5px; white-space:nowrap; }

  .stamp{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding: 3px 8px; border-radius: 20px; white-space:nowrap; cursor:pointer; user-select:none; }
  .stamp.paid{ color: var(--green); border: 1.5px solid var(--green); transform: rotate(-4deg); }
  .stamp.pending{ color: var(--brass); border: 1.5px dashed var(--brass); transform: rotate(3deg); }

  .row-actions{ display:flex; align-items:center; gap:8px; }
  .del-btn{ background:none;border:none;color:var(--ink-faint); cursor:pointer; font-size:15px; padding:4px; line-height:1; }
  .del-btn:hover{ color: var(--rouge); }

  .empty{ text-align:center; padding: 40px 20px; color: var(--ink-faint); }
  .empty .glyph{ font-size:26px; margin-bottom:8px; }
  .empty .title{ font-family:'Fraunces',serif; font-size:15px; color:var(--ink-soft); margin-bottom:4px;}

  /* ---------- MEMBER CARD ---------- */
  .fam-tag{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin: 14px 0 6px 2px; }
  .member-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 8px; display:flex; align-items:center; gap:12px; }
  .member-card .who{ width:42px;height:42px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px; background: var(--green-soft); color:var(--green); flex-shrink:0; }
  .member-card .info{ flex:1; }
  .member-card .info .name{ font-weight:600; font-size:14.5px; }
  .member-card .info .total{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .member-card .acts{ display:flex; gap:2px; }

  /* ---------- FAB ---------- */
  .fab{ position:fixed; left:50%; transform: translateX(-50%); bottom: 22px; max-width:520px; width: calc(100% - 40px); z-index:20; }
  .fab button{ width:100%; background: var(--ink); color: var(--paper-light); border:none; border-radius: 999px; padding: 15px; font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px; box-shadow: 0 8px 24px rgba(30,42,56,0.28); cursor:pointer; }

  /* ---------- SHEET ---------- */
  .overlay{ position:fixed; inset:0; background: rgba(30,42,56,0.45); display:none; align-items:flex-end; justify-content:center; z-index:30; }
  .overlay.active{ display:flex; }
  .sheet{ background: var(--paper-light); width:100%; max-width:520px; border-radius: 20px 20px 0 0; padding: 22px 20px 28px; max-height:88vh; overflow-y:auto; animation: slideup .2s ease-out; }
  @keyframes slideup{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .sheet h3{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin: 0 0 16px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--paper-line); background: var(--paper); font-family:'Inter',sans-serif; font-size:14.5px; color: var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: 2px solid var(--brass); outline-offset:1px; border-color:transparent; }
  .field small.hint{ display:block; margin-top:5px; font-size:11.5px; color:var(--ink-faint); }
  .toggle-group{ display:flex; gap:8px; margin-bottom:14px; }
  .toggle-group button{ flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--paper-line); background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
  .toggle-group button.active{ background: var(--ink); color: var(--paper-light); border-color:var(--ink); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{ background: var(--ink); color: var(--paper-light); }
  .btn-secondary{ background: var(--paper); color: var(--ink-soft); border:1.5px solid var(--paper-line) !important; }

  .dashed-btn{ width:100%; margin-top:4px; padding:13px; border-radius:12px; border:1.5px dashed var(--brass); background:var(--brass-soft); color:var(--brass); font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background: var(--ink); color:var(--paper-light); font-size:13px; padding: 10px 18px; border-radius: 999px; z-index:50; opacity:0; transition: opacity .25s, transform .25s; pointer-events:none; font-family:'Inter',sans-serif; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(4px); }

  .loading-screen{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:100; }
  .loading-screen .glyph{ font-family:'Fraunces',serif; font-size:22px; color:var(--ink-soft); }

  .readonly-badge{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-faint); background: var(--paper-light); border:1px solid var(--paper-line); padding:5px 10px; border-radius:20px; display:inline-block; margin-bottom:12px; }
  .stamp.readonly{ cursor:default; opacity:0.85; }

  .chart-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 14px; margin-bottom:16px; }
  .chart-card h3{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; margin: 0 0 4px; }
  .chart-card .chart-sub{ font-size:11.5px; color:var(--ink-faint); margin-bottom:10px; font-family:'IBM Plex Mono',monospace; }
  .chart-empty{ text-align:center; padding:24px 10px; color:var(--ink-faint); font-size:13px; }

  /* ---------- ARCHIVES ---------- */
  .event-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
  .event-card .event-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .event-card .event-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; }
  .event-card .event-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .photo-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap:6px; margin-bottom:10px; }
  .photo-grid .photo-thumb{ position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--paper); }
  .photo-grid .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .photo-grid .photo-thumb .photo-del{ position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(30,42,56,0.65); color:#fff; border:none; font-size:11px; cursor:pointer; line-height:1; }
  .lightbox{ position:fixed; inset:0; background:rgba(10,14,18,0.92); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .lightbox.active{ display:flex; }
  .lightbox img{ max-width:100%; max-height:90vh; border-radius:8px; }
  .lightbox .lightbox-close{ position:absolute; top:18px; right:18px; color:#fff; font-size:22px; background:none; border:none; cursor:pointer; }

  /* ---------- SUGGESTIONS ---------- */
  .suggestion-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 8px; }
  .suggestion-card .sug-meta{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
  .suggestion-card .sug-text{ font-size:14px; line-height:1.5; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="loading-screen" id="loadingScreen"><div class="glyph">Ouverture du registre…</div></div>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen" style="display:none;">
    <div class="eyebrow">ANYRONVIWO  MISOGBE!!!!</div>
    <h1 id="loginTitle">Le Registre</h1>
    <p class="sub" id="loginSub">Entrez votre code personnel pour accéder au registre.</p>
    <div class="login-error" id="loginError"></div>
    <div id="loginFormZone"></div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" style="display:none;">
    <header class="cover">
      <span class="logout" id="logoutBtn">Déconnexion</span>
      <div class="eyebrow">Caisse familiale</div>
      <h1>Le Registre</h1>
      <div class="userline" id="userline"></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-view="apercu">Ma famille</button>
      <button class="tab-btn" data-view="cotisations">Cotisations</button>
      <button class="tab-btn" data-view="membres">Membres</button>
      <button class="tab-btn" data-view="evolution">Évolution</button>
      <button class="tab-btn" data-view="archives">Archives</button>
      <button class="tab-btn" data-view="suggestions">Suggestions</button>
      <button class="tab-btn" data-view="boite" id="boiteTabBtn" style="display:none;">Boîte de réception<span class="tab-badge" id="boiteBadge" style="display:none;"></span></button>
      <button class="tab-btn" data-view="profil">Mon Profil</button>
      <button class="tab-btn" data-view="hierarchie">Hiérarchie</button>
      <button class="tab-btn" data-view="reunions">Notes de Réunions</button>
      <button class="tab-btn" data-view="autorisations" id="autorisationsTabBtn" style="display:none;">Autorisations<span class="tab-badge" id="autorisationsBadge" style="display:none;"></span></button>
    </nav>

    <main>
      <section class="view active" id="view-apercu">
        <h2 class="section-title">Choisir une famille</h2>
        <div class="family-grid" id="familyGrid"></div>
      </section>

      <section class="view" id="view-cotisations">
        <div id="cotisationsInner"></div>
      </section>

      <section class="view" id="view-membres">
        <h2 class="section-title">Membres</h2>
        <div id="membersList"></div>
      </section>

      <section class="view" id="view-evolution">
        <div id="evolutionInner"></div>
      </section>

      <section class="view" id="view-archives">
        <div id="archivesInner"></div>
      </section>

      <section class="view" id="view-suggestions">
        <div id="suggestionsInner"></div>
      </section>

      <section class="view" id="view-boite">
        <div id="boiteInner"></div>
      </section>

      <section class="view" id="view-profil">
        <div id="profilInner"></div>
      </section>

      <section class="view" id="view-hierarchie">
        <div id="hierarchieInner"></div>
      </section>

      <section class="view" id="view-reunions">
        <div id="reunionsInner"></div>
      </section>

      <section class="view" id="view-autorisations">
        <div id="autorisationsInner"></div>
      </section>
    </main>

    <div class="fab" id="fabAdd" style="display:none;">
      <button id="fabBtn">＋ Ajouter une cotisation</button>
    </div>
  </div>

  <div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
  <div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">✕</button><img id="lightboxImg" src="" alt=""></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* Stockage externe (jsonblob.com) — indépendant de Claude, aucun compte requis pour les visiteurs.
   BLOB_ID doit être renseigné une fois le registre initialisé sur https://jsonblob.com */
const BLOB_ID = '019fbf27-038a-7eb2-9fdb-66495dbcfcfe';
const API_BASE = 'https://jsonblob.com/api/jsonBlob/';
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

let data = { families: [], members: [], lists: [], cotisations: [], archives: [], archiveDocuments: [], suggestions: [], hierarchy: [], meetingNotes: [] };
let session = { memberId: null };
let ui = { view:'apercu', activeFamilyId:null, listFilter:'', yearFilter:'', monthFilter:'', evoYear:'', membreFilter:'all', archiveFilter:'all' };

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function euros(n){ return Math.round(n).toLocaleString('fr-FR') + ' FCFA'; }
function initials(str){ return (str||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHTML(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function defaultData(){
  return {
    families: [
      { id:'fam1', name:'AGBOKOUVIWO' },
      { id:'fam2', name:'ANYRONVIWO' }
    ],
    members: [],
    lists: [],
    cotisations: [],
    archives: [],
    archiveDocuments: [],
    suggestions: [],
    hierarchy: [],
    meetingNotes: []
  };
}

/* Migration : convertit l'ancien champ familyId (unique, incluant 'all') vers familyIds (tableau) + statut */
function migrateMembers(){
  let changed = false;
  data.members.forEach(m=>{
    if(!Array.isArray(m.familyIds)){
      if(m.familyId==='all'){ m.familyIds = data.families.map(f=>f.id); }
      else if(m.familyId){ m.familyIds = [m.familyId]; }
      else { m.familyIds = []; }
      delete m.familyId;
      m.status = 'active';
      m.pendingFamilyIds = [];
      changed = true;
    }
    if(!m.status){ m.status = 'active'; changed = true; }
    if(!Array.isArray(m.pendingFamilyIds)){ m.pendingFamilyIds = []; changed = true; }
  });
  if(changed) saveData();
}

/* Identités habilitées à saisir/gérer les cotisations. Comparaison insensible à la casse. */
const ADMIN_IDENTITIES = [
  { nom:'AGBOKOU', prenom:'DANIEL' },
  { nom:'AMOUZOU', prenom:'PROSPER' }
];
function isAdmin(m){
  if(!m) return false;
  const nom = (m.nom||'').trim().toUpperCase();
  const prenom = (m.prenom||'').trim().toUpperCase();
  return ADMIN_IDENTITIES.some(a => a.nom===nom && a.prenom===prenom);
}
/* Familles que le membre courant est autorisé à voir. Les admins voient tout. */
function visibleFamilies(includeAll){
  const me = currentMember();
  if(isAdmin(me)){
    return includeAll ? [{id:'all', name:'Tout'}, ...data.families] : data.families.slice();
  }
  if(!me) return [];
  return data.families.filter(f => (me.familyIds||[]).includes(f.id));
}
function clampFamilyFilter(current){
  const allowed = visibleFamilies(true).map(f=>f.id);
  return allowed.includes(current) ? current : (allowed[0] || '');
}
function familyCheckboxesHTML(idPrefix, selectedIds){
  return data.families.map(f=>`
    <label style="display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14px;cursor:pointer;">
      <input type="checkbox" id="${idPrefix}_${f.id}" value="${f.id}" ${selectedIds.includes(f.id)?'checked':''} style="width:18px;height:18px;">
      ${escapeHTML(f.name)}
    </label>`).join('');
}
function getCheckedFamilyIds(idPrefix){
  return data.families.filter(f => { const el = $('#'+idPrefix+'_'+f.id); return el && el.checked; }).map(f=>f.id);
}
function passwordFieldHTML(id, value, placeholder){
  return `<div style="position:relative;">
    <input type="password" id="${id}" value="${escapeHTML(value||'')}" placeholder="${placeholder||''}" style="padding-right:44px;">
    <button type="button" data-toggle-pass="${id}" title="Afficher/masquer" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--ink-faint);padding:6px;line-height:1;">👁</button>
  </div>`;
}
function wirePasswordToggles(scope){
  (scope||document).querySelectorAll('[data-toggle-pass]').forEach(b=>{
    b.onclick = () => {
      const inp = $('#'+b.dataset.togglePass);
      if(!inp) return;
      if(inp.type==='password'){ inp.type='text'; b.textContent='🙈'; }
      else { inp.type='password'; b.textContent='👁'; }
    };
  });
}

function currentMember(){ return data.members.find(m=>m.id===session.memberId); }

async function loadData(){
  if(!BLOB_ID || BLOB_ID === 'REPLACE_WITH_BLOB_ID'){
    showSetupError('Le registre n’a pas encore été configuré. Contactez l’administrateur.');
    return;
  }
  try{
    const res = await fetch(API_BASE + BLOB_ID, { headers: {'Accept':'application/json'} });
    if(!res.ok) throw new Error('registre introuvable ('+res.status+')');
    const loaded = await res.json();
    data = Object.assign(defaultData(), loaded);
    if(!data.families || data.families.length===0) data.families = defaultData().families;
  }catch(e){
    console.error(e);
    showSetupError('Impossible de contacter le registre. Vérifiez votre connexion internet et réessayez.');
    return;
  }
  migrateFamilies();
  migrateMembers();
  $('#loadingScreen').style.display='none';
  showLogin();
}

function showSetupError(msg){
  $('#loadingScreen').innerHTML = `<div class="glyph" style="text-align:center;padding:0 24px;">${escapeHTML(msg)}</div><button id="retryBtn" style="margin-top:14px;padding:10px 18px;border-radius:20px;border:none;background:var(--ink);color:var(--paper-light);font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;">Réessayer</button>`;
  $('#retryBtn').onclick = () => { $('#loadingScreen').innerHTML = '<div class="glyph">Ouverture du registre…</div>'; loadData(); };
}

function migrateFamilies(){
  let changed = false;
  data.suggestions.forEach(s=>{ if(s.lu===undefined){ s.lu = true; changed = true; } });
  if(changed) saveData();
}

async function saveData(){
  try{
    const res = await fetch(API_BASE + BLOB_ID, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error('échec de l’enregistrement ('+res.status+')');
  }catch(e){
    console.error(e);
    showToast("Erreur d'enregistrement, vérifiez votre connexion et réessayez.");
  }
}

function doLogin(){

  if(!m){ loginError('Code non reconnu. Créez un profil si c’est votre première visite.'); return; }

function doSignup(){
  const prenom = $('#s_prenom').value.trim();
  const nom = $('#s_nom').value.trim();
  const pendingFamilyIds = getCheckedFamilyIds('s_fam');
  const code = $('#s_code').value.trim();
  if(!prenom || !nom){ loginError('Indiquez votre nom et prénom.'); return; }
  if(pendingFamilyIds.length===0){ loginError('Choisissez au moins une famille.'); return; }
  if(!code){ loginError('Choisissez un code personnel.'); return; }
  if(data.members.some(m=>m.code===code)){ loginError('Ce code est déjà utilisé, choisissez-en un autre.'); return; }
  const member = { id: uid(), prenom, nom, code, familyIds: [], pendingFamilyIds, status: 'pending' };
  data.members.push(member);
  saveData();
  renderLoginForm();
  loginError('Votre demande a été envoyée aux administrateurs. Vous pourrez vous connecter une fois validée.');
  $('#loginError').style.background = 'rgba(63,107,79,0.18)';
  $('#loginError').style.color = '#B7D9C4';
  $('#loginError').style.borderColor = 'rgba(63,107,79,0.4)';
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function exportListCSV(list){
  const rows = data.cotisations.filter(c=>c.listId===list.id).sort((a,b)=>a.date.localeCompare(b.date));
  const header = ['Nom','Prénom','Montant (FCFA)','Date','Statut','Note'];
  const lines = [header.map(csvEscape).join(';')];
  rows.forEach(c=>{
    const m = data.members.find(m=>m.id===c.memberId);
    lines.push([m?m.nom:'', m?m.prenom:'', c.amount, c.date, c.status==='paid'?'Payé':'En attente', c.label||''].map(csvEscape).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, `${list.name.replace(/[^\w\- ]/g,'')}.csv`);
}

function exportFamilyCSV(famName, famLists, famCotis){
  const header = ['Liste','Nom','Prénom','Montant (FCFA)','Date','Statut','Note'];
  const lines = [header.map(csvEscape).join(';')];
  famCotis.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>{
    const list = famLists.find(l=>l.id===c.listId);
    const m = data.members.find(m=>m.id===c.memberId);
    lines.push([list?list.name:'', m?m.nom:'', m?m.prenom:'', c.amount, c.date, c.status==='paid'?'Payé':'En attente', c.label||''].map(csvEscape).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, `${famName.replace(/[^\w\- ]/g,'')}-cotisations.csv`);
}

function passesFilter(c){
  if(ui.yearFilter && c.date.slice(0,4)!==ui.yearFilter) return false;
  if(ui.monthFilter && String(parseInt(c.date.slice(5,7),10))!==String(ui.monthFilter)) return false;
  return true;
}

function renderListsZone(fam, famLists, famCotis, canWrite){
  const zone = $('#listsZone');
  let listsToShow = ui.listFilter ? famLists.filter(l=>l.id===ui.listFilter) : famLists;

  if(famLists.length===0){
    zone.innerHTML = emptyState('📖','Aucune liste pour l’instant', canWrite ? 'Créez une première liste avec le bouton ci-dessous.' : 'Aucune cotisation n’a encore été saisie.');
    return;
  }

  let html = '';
  let anyRow = false;
  listsToShow.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')).forEach(list=>{
    const rows = famCotis.filter(c=>c.listId===list.id && passesFilter(c)).sort((a,b)=>b.date.localeCompare(a.date));
    if(rows.length===0) return;
    anyRow = true;
    const subtotal = rows.filter(c=>c.status==='paid').reduce((s,c)=>s+c.amount,0);
    html += `
      <div class="list-group">
        <div class="list-group-header">
          <span class="lname">${escapeHTML(list.name)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="ltotal">${euros(subtotal)}</span>
            <button class="del-btn" data-export-list="${list.id}" title="Télécharger cette liste (CSV)">📥</button>
            ${canWrite ? `<button class="del-btn" data-rename-list="${list.id}" title="Renommer la liste">✎</button><button class="del-btn" data-del-list="${list.id}" title="Supprimer la liste">✕</button>` : ''}
          </span>
        </div>
        <div class="ledger">${rows.map(c=>ledgerRowHTML(c, canWrite)).join('')}</div>
      </div>`;
  });

  zone.innerHTML = anyRow ? html : emptyState('🔍','Rien à afficher','Aucune cotisation ne correspond à ces filtres.');
  zone.querySelectorAll('[data-export-list]').forEach(b=>{
    b.onclick = () => {
      const list = data.lists.find(l=>l.id===b.dataset.exportList);
      exportListCSV(list);
    };
  });
  if(!canWrite) return;
  zone.querySelectorAll('[data-toggle]').forEach(s=>{
    s.onclick = () => {
      const c = data.cotisations.find(c=>c.id===s.dataset.toggle);
      c.status = c.status==='paid' ? 'pending' : 'paid';
      saveData(); render();
    };
  });
  zone.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = () => {
      if(confirm('Supprimer cette cotisation ?')){
        data.cotisations = data.cotisations.filter(c=>c.id!==b.dataset.del);
        saveData(); render();
      }
    };
  });
  zone.querySelectorAll('[data-rename-list]').forEach(b=>{
    b.onclick = () => {
      const list = data.lists.find(l=>l.id===b.dataset.renameList);
      const name = prompt('Nom de la liste :', list.name);
      if(name && name.trim()){ list.name = name.trim(); saveData(); render(); }
    };
  });
  zone.querySelectorAll('[data-del-list]').forEach(b=>{
    b.onclick = () => {
      if(confirm('Supprimer cette liste et toutes ses cotisations ?')){
        const listId = b.dataset.delList;
        data.lists = data.lists.filter(l=>l.id!==listId);
        data.cotisations = data.cotisations.filter(c=>c.listId!==listId);
        saveData(); render();
      }
    };
  });
}

function renderEvoCharts(famLists, famCotis){
  const zone = $('#evoCharts');
  const yearCotis = famCotis.filter(c=>c.date.slice(0,4)===ui.evoYear);

  // Chart 1 — monthly evolution for the selected year
  const monthTotals = new Array(12).fill(0);
  yearCotis.forEach(c=>{ monthTotals[parseInt(c.date.slice(5,7),10)-1] += c.amount; });
  const hasMonthData = monthTotals.some(v=>v>0);

  // Chart 2 — total per list (selected year)
  const listTotals = famLists.map(l=>({
    name: l.name,
    total: yearCotis.filter(c=>c.listId===l.id).reduce((s,c)=>s+c.amount,0)
  })).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

  zone.innerHTML = `
    <div class="chart-card">
      <h3>Évolution mensuelle</h3>
      <div class="chart-sub">Total collecté par mois — ${ui.evoYear}</div>
      ${hasMonthData ? svgBarChart(MONTHS_SHORT, monthTotals, 'var(--brass)') : '<div class="chart-empty">Aucune cotisation payée cette année-là.</div>'}
    </div>
    <div class="chart-card">
      <h3>Par liste de cotisation</h3>
      <div class="chart-sub">Total collecté par liste — ${ui.evoYear}</div>
      ${listTotals.length>0 ? svgBarChart(listTotals.map(x=>truncateLabel(x.name)), listTotals.map(x=>x.total), 'var(--green)') : '<div class="chart-empty">Aucune liste avec des paiements cette année-là.</div>'}
    </div>
  `;
}

function truncateLabel(s){ return s.length>10 ? s.slice(0,9)+'…' : s; }

function svgBarChart(labels, values, color){
  const w = 480, h = 210, padL=8, padR=8, padT=18, padB=28;
  const max = Math.max(1, ...values);
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const gap = innerW / labels.length;
  const barW = Math.min(34, gap*0.55);
  let bars = '';
  labels.forEach((lab,i)=>{
    const val = values[i] || 0;
    const barH = (val/max) * innerH;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + (innerH - barH);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" rx="3" style="fill:${color}"></rect>`;
    if(val>0){
      bars += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9" text-anchor="middle" style="fill:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">${Math.round(val)}</text>`;
    }
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-padB+13}" font-size="9" text-anchor="middle" style="fill:var(--ink-faint);font-family:'IBM Plex Mono',monospace;">${escapeHTML(lab)}</text>`;
  });
  bars += `<line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" style="stroke:var(--paper-line);stroke-width:1;"></line>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${bars}</svg>`;
}

/* ================= IMPORT FICHIER ================= */
const HEADER_ALIASES = {
  prenom: ['prenom','prénom','first name','firstname','prenoms'],
  nom: ['nom','last name','lastname','surname','nom de famille'],
  fullname: ['nom complet','membre','name','nom et prenom','nom prenom','nom & prenom'],
  montant: ['montant','amount','somme','montant (eur)','montant eur','montant (€)','montant(€)','fcfa','montant (fcfa)','montant fcfa'],
  date: ['date'],
  statut: ['statut','status','etat','état'],
  motif: ['motif','note','commentaire','description']
};

function normalizeStr(s){ return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }

function detectColumns(headerRow){
  const map = {};
  headerRow.forEach(h=>{
    const n = normalizeStr(h);
    for(const key in HEADER_ALIASES){
      if(HEADER_ALIASES[key].some(a=>normalizeStr(a)===n)){ map[key]=h; }
    }
  });
  return map;
}

function parseImportRows(rows, famMembers){
  const matched = [], unmatched = [];
  if(rows.length===0) return {matched, unmatched};
  const headers = Object.keys(rows[0]);
  const colMap = detectColumns(headers);
  const today = new Date().toISOString().slice(0,10);

  rows.forEach((row, idx)=>{
    let prenom = colMap.prenom ? String(row[colMap.prenom]||'').trim() : '';
    let nom = colMap.nom ? String(row[colMap.nom]||'').trim() : '';
    if((!prenom || !nom) && colMap.fullname){
      const full = String(row[colMap.fullname]||'').trim();
      if(full && !prenom && !nom){
        const parts = full.split(/\s+/);
        if(parts.length>=2){ prenom = parts[0]; nom = parts.slice(1).join(' '); }
      }
    }
    if(!prenom && !nom) return; // ligne vide, ignorée silencieusement

    const member = famMembers.find(m => normalizeStr(m.prenom)===normalizeStr(prenom) && normalizeStr(m.nom)===normalizeStr(nom))
      || famMembers.find(m => normalizeStr(m.prenom+' '+m.nom)===normalizeStr(prenom+' '+nom))
      || famMembers.find(m => normalizeStr(m.nom+' '+m.prenom)===normalizeStr(prenom+' '+nom));

    const amountRaw = colMap.montant ? row[colMap.montant] : '';
    const amount = parseFloat(String(amountRaw).replace(/[^\d,.\-]/g,'').replace(',','.'));

    if(!member){ unmatched.push({ reason: `${prenom} ${nom} (ligne ${idx+2}) : membre introuvable` }); return; }
    if(!amount || amount<=0){ unmatched.push({ reason: `${prenom} ${nom} (ligne ${idx+2}) : montant invalide` }); return; }

    let date = today;
    const dateVal = colMap.date ? String(row[colMap.date]||'').trim() : '';
    if(dateVal){ const d = new Date(dateVal); if(!isNaN(d.getTime())) date = d.toISOString().slice(0,10); }

    let status = 'paid';
    const statutVal = colMap.statut ? normalizeStr(String(row[colMap.statut]||'')) : '';
    if(statutVal && ['attente','pending','non','no','impaye'].some(k=>statutVal.includes(k))) status = 'pending';

    const label = colMap.motif ? String(row[colMap.motif]||'').trim() : '';
    matched.push({ memberId: member.id, memberName: `${member.prenom} ${member.nom}`, amount, date, status, label });
  });

  return { matched, unmatched };
}

function openImportSheet(famId){
  const famMembers = data.members.filter(m=>m.familyIds && m.familyIds.includes(famId));

        <button class="btn-primary" id="analyzeBtn">Analyser le fichier</button>
      </div>
    `;
    function renderListField(){
      const zone = $('#im_listFieldZone');

        ? `<select id="im_list">${famLists.map(l=>`<option value="${l.id}">${escapeHTML(l.name)}</option>`).join('')}</select>`
        : `<input type="text" id="im_newlist" placeholder="ex : Cotisation Février 2026">`;

    $('#cancelSheet').onclick = closeSheet;
    $('#analyzeBtn').onclick = () => {
      const fileInput = $('#importFile');
      if(!fileInput.files || fileInput.files.length===0){ showToast('Choisissez un fichier.'); return; }
      let listName = null, listId = null;
      if(importListMode==='new'){
        listName = $('#im_newlist').value.trim();
        if(!listName){ showToast('Nommez la nouvelle liste.'); return; }
      } else {
        listId = $('#im_list').value;
      }
      const file = fileInput.files[0];
      const isCSV = /\.csv$/i.test(file.name);
      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const wb = isCSV ? XLSX.read(e.target.result, {type:'string'}) : XLSX.read(e.target.result, {type:'array', cellDates:true});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false, dateNF:'yyyy-mm-dd'});
          const result = parseImportRows(rows, famMembers);
          renderPreview(result, importListMode, listName, listId);
        }catch(err){
          console.error(err);
          showToast('Impossible de lire ce fichier. Vérifiez le format.');
        }
      };
      if(isCSV) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    };
  }

  function renderPreview(result, mode, listName, listId){
    const { matched, unmatched } = result;
    const total = matched.reduce((s,r)=>s+r.amount,0);
    $('#sheetContent').innerHTML = `
      <h3>Aperçu de l’import</h3>
      <p class="muted" style="margin-bottom:10px;">${matched.length} ligne(s) reconnue(s) — ${euros(total)} au total.${unmatched.length>0 ? ` ${unmatched.length} ligne(s) ignorée(s).` : ''}</p>
      <div class="ledger" style="margin-bottom:12px; max-height:240px; overflow-y:auto;">
        ${matched.slice(0,50).map(r=>`
          <div class="ledger-row">
            <div class="who">${initials(r.memberName)}</div>
            <div class="info"><div class="name">${escapeHTML(r.memberName)}</div><div class="meta">${escapeHTML(r.date)}${r.label?' · '+escapeHTML(r.label):''}</div></div>
            <div class="row-actions">
              <span class="stamp ${r.status==='paid'?'paid':'pending'} readonly">${r.status==='paid'?'Payé':'En attente'}</span>
              <span class="amount">${euros(r.amount)}</span>
            </div>
          </div>`).join('')}
      </div>
      ${matched.length>50 ? `<p class="muted">…et ${matched.length-50} de plus.</p>` : ''}
      ${unmatched.length>0 ? `<p class="muted" style="color:var(--rouge);">Ignorés : ${unmatched.slice(0,8).map(u=>escapeHTML(u.reason)).join(' · ')}${unmatched.length>8?' …':''}</p>` : ''}
      <div class="sheet-actions">
        <button class="btn-secondary" id="backBtn">Retour</button>
        <button class="btn-primary" id="confirmImportBtn" ${matched.length===0?'disabled':''}>Importer ${matched.length} cotisation(s)</button>
      </div>
    `;
    $('#backBtn').onclick = renderStep1;
    if(matched.length>0){
      $('#confirmImportBtn').onclick = () => {
        let finalListId = listId;
        if(mode==='new'){
          const list = { id: uid(), familyId: famId, name: listName, createdAt: new Date().toISOString().slice(0,10) };
          data.lists.push(list);
          finalListId = list.id;
        }
        matched.forEach(r=>{
          data.cotisations.push({ id: uid(), listId: finalListId, memberId: r.memberId, amount: r.amount, date: r.date, label: r.label, status: r.status });
        });
        saveData(); render(); closeSheet();
        showToast(`${matched.length} cotisation(s) importée(s).`);
      };
    }
  }

  renderStep1();
  openSheet();
}

          <button class="btn-primary" data-validate-request="${m.id}" style="width:100%;padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;margin-top:8px;">Valider la sélection</button>
        </div>`);
    });
  }
  el.querySelectorAll('[data-validate-request]').forEach(b=>{
    b.onclick = () => {
      const mid = b.dataset.validateRequest;
      const m = data.members.find(x=>x.id===mid);
      const approved = data.families.filter(f => { const cb = $('#req_'+mid+'_'+f.id); return cb && cb.checked; }).map(f=>f.id);
      const denied = data.families.filter(f=>!approved.includes(f.id)).map(f=>f.name);
      m.familyIds = approved;
      m.status = 'active';
      m.pendingFamilyIds = [];
      const approvedNames = data.families.filter(f=>approved.includes(f.id)).map(f=>f.name);
      let msg;
      if(approvedNames.length===0) msg = `Votre inscription a été refusée pour toutes les familles demandées.`;
      else if(denied.length===0) msg = `Votre inscription a été validée pour : ${approvedNames.join(', ')}.`;
      else msg = `Votre inscription a été validée pour : ${approvedNames.join(', ')}. Refusée pour : ${denied.join(', ')}.`;
      data.suggestions.push({
        id: uid(), senderId: me.id, senderName: `${me.prenom} ${me.nom}`,
        recipientId: m.id, recipientName: `${m.prenom} ${m.nom}`,
        text: msg, date: new Date().toISOString(), lu: false
      });
      saveData(); render();
      showToast(`Inscription de ${m.prenom} ${m.nom} traitée.`);
    };
  });

  renderFamiliesManage();
}

function renderFamiliesManage(){
  const zone = $('#familiesManageZone');
  if(!zone) return;
  let html = `<h2 class="section-title" style="margin-top:22px;">Gérer les familles</h2>`;
  data.families.forEach(f=>{
    const memCount = data.members.filter(m=>(m.familyIds||[]).includes(f.id)).length;
    const pendCount = data.members.filter(m=>(m.pendingFamilyIds||[]).includes(f.id)).length;
    const listCount = data.lists.filter(l=>l.familyId===f.id).length;
    html += `
      <div class="member-card">
        <div class="who">${initials(f.name)}</div>
        <div class="info"><div class="name">${escapeHTML(f.name)}</div><div class="total">${memCount} membre(s) · ${listCount} liste(s)</div></div>
        <div class="acts"><button class="del-btn" data-del-family="${f.id}" title="Supprimer">✕</button></div>
      </div>`;
  });
  zone.innerHTML = html;
  zone.querySelectorAll('[data-del-family]').forEach(b=>{
    b.onclick = () => {
      const f = data.families.find(x=>x.id===b.dataset.delFamily);
      const usedBy = data.members.filter(m=>(m.familyIds||[]).includes(f.id) || (m.pendingFamilyIds||[]).includes(f.id)).length;
      const hasLists = data.lists.some(l=>l.familyId===f.id);
      const hasArchives = data.archives.some(e=>e.familyId===f.id) || data.archiveDocuments.some(d=>d.familyId===f.id);
      const hasHier = data.hierarchy.some(h=>h.familyId===f.id);
      const hasNotes = data.meetingNotes.some(n=>n.familyId===f.id);
      if(usedBy>0 || hasLists || hasArchives || hasHier || hasNotes){
        showToast('Impossible : des membres ou des données sont encore rattachés à cette famille.');
        return;
      }
      if(confirm(`Supprimer définitivement "${f.name}" ?`)){
        data.families = data.families.filter(x=>x.id!==f.id);
        saveData(); render();
        showToast('Famille supprimée.');
      }
    };
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'dashed-btn';
  addBtn.style.marginTop = '4px';
  addBtn.textContent = '＋ Créer une famille';
  addBtn.onclick = () => {
    const name = prompt('Nom de la nouvelle famille :');
    if(name && name.trim()){
      data.families.push({ id: uid(), name: name.trim() });
      saveData(); render();
      showToast('Famille créée.');
    }
  };
  zone.appendChild(addBtn);
}

function updateAutorisationsBadge(me){
  const badge = $('#autorisationsBadge');
  if(!badge) return;
  if(!me || !isAdmin(me)){ badge.style.display='none'; return; }
  const count = data.members.filter(m=>m.status==='pending').length;
  if(count>0){ badge.textContent = count; badge.style.display='inline-block'; }
  else { badge.style.display='none'; }
}

/* ================= HIÉRARCHIE ================= */
const ROLE_PRESETS = ['Président','Chef de famille','Secrétaire','Trésorier','Vice-Président','Censeur','Conseiller'];

function renderHierarchie(){
  const el = $('#hierarchieInner');
  if(!el) return;
  if(!ui.hierFilter) ui.hierFilter = 'all';
  ui.hierFilter = clampFamilyFilter(ui.hierFilter);
  const canWrite = isAdmin(currentMember());
  const options = visibleFamilies(true);
  const entries = data.hierarchy.filter(h => ui.hierFilter==='all' ? true : h.familyId===ui.hierFilter);

  let html = `
    <h2 class="section-title">Hiérarchie</h2>
    <div class="family-select-row" style="margin-bottom:14px;">
      <select id="hierFamilySelect">${options.map(f=>`<option value="${f.id}" ${ui.hierFilter===f.id?'selected':''}>${escapeHTML(f.name)}</option>`).join('')}</select>
    </div>
    <button class="dashed-btn" id="exportHierBtn" style="margin-bottom:14px;">📤 Télécharger (CSV)</button>
  `;

  if(entries.length===0){
    html += emptyState('🏛️','Aucun membre du comité','Ajoutez les rôles du comité (Président, Trésorier…).');
  } else {
    data.families.forEach(f=>{
      const famEntries = entries.filter(h=>h.familyId===f.id);
      if(famEntries.length===0) return;
      html += `<div class="fam-tag">${escapeHTML(f.name)}</div>`;
      famEntries.forEach(h=>{
        html += `
          <div class="member-card">
            <div class="who">${initials(h.role)}</div>
            <div class="info"><div class="name">${escapeHTML(h.name)}</div><div class="total" style="color:var(--brass);font-weight:600;">${escapeHTML(h.role)}</div></div>
            ${canWrite ? `<div class="acts"><button class="del-btn" data-edit-hier="${h.id}" title="Modifier">✎</button><button class="del-btn" data-del-hier="${h.id}" title="Retirer">✕</button></div>` : ''}
          </div>`;
      });
    });
  }

  el.innerHTML = html;
  $('#hierFamilySelect').onchange = e => { ui.hierFilter = e.target.value; render(); };
  $('#exportHierBtn').onclick = () => exportHierarchyCSV(entries);
  if(canWrite){
    el.querySelectorAll('[data-del-hier]').forEach(b=>{
      b.onclick = () => {
        if(confirm('Retirer cette personne du comité ?')){
          data.hierarchy = data.hierarchy.filter(h=>h.id!==b.dataset.delHier);
          saveData(); render();
        }
      };
    });
    el.querySelectorAll('[data-edit-hier]').forEach(b=>{
      b.onclick = () => openHierarchySheet(b.dataset.editHier);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'dashed-btn';
    addBtn.style.marginTop = '4px';
    addBtn.textContent = '＋ Ajouter au comité';
    addBtn.onclick = () => openHierarchySheet(null);
    el.appendChild(addBtn);
  }
}

function exportHierarchyCSV(entries){
  const header = ['Famille','Rôle','Nom'];
  const lines = [header.map(csvEscape).join(';')];
  entries.forEach(h=>{
    const f = data.families.find(f=>f.id===h.familyId);
    lines.push([f?f.name:'Tout', h.role, h.name].map(csvEscape).join(';'));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, 'hierarchie.csv');
}

function openHierarchySheet(hierId){
  const existing = hierId ? data.hierarchy.find(h=>h.id===hierId) : null;
  $('#sheetContent').innerHTML = `
    <h3>${existing ? 'Modifier' : 'Ajouter au'} comité</h3>
    <div class="field"><label>Famille</label>
      <select id="h_family">${data.families.map(f=>`<option value="${f.id}" ${(existing?existing.familyId:ui.hierFilter)===f.id?'selected':''}>${escapeHTML(f.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Rôle</label>
      <input type="text" id="h_role" value="${existing?escapeHTML(existing.role):''}" placeholder="ex : Trésorier">
      <div class="presets">${ROLE_PRESETS.map(r=>`<button type="button" data-preset-role="${escapeHTML(r)}">${r}</button>`).join('')}</div>
    </div>
    <div class="field"><label>Nom complet</label><input type="text" id="h_name" value="${existing?escapeHTML(existing.name):''}" placeholder="ex : Jean Dupont"></div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelSheet">Annuler</button>
      <button class="btn-primary" id="saveSheet">Enregistrer</button>
    </div>
  `;
  $('#sheetContent').querySelectorAll('[data-preset-role]').forEach(b=>{
    b.onclick = () => { $('#h_role').value = b.dataset.presetRole; };
  });
  $('#cancelSheet').onclick = closeSheet;
  $('#saveSheet').onclick = () => {
    const role = $('#h_role').value.trim();
    const name = $('#h_name').value.trim();
    if(!role || !name){ showToast('Indiquez le rôle et le nom.'); return; }
    if(existing){
      existing.role = role; existing.name = name; existing.familyId = $('#h_family').value;
    } else {
      data.hierarchy.push({ id: uid(), familyId: $('#h_family').value, role, name });
    }
    saveData(); render(); closeSheet();
    showToast('Comité mis à jour.');
  };
  openSheet();
}

/* ================= ADD COTISATION SHEET ================= */
let listMode = 'existing';
let cotisationEntryMode = 'fiche';

function openAddCotisationSheet(){
  if(!isAdmin(currentMember())){ showToast('Seuls AGBOKOU Daniel et AMOUZOU Prosper peuvent saisir des cotisations.'); return; }
  if(!ui.activeFamilyId){ showToast('Choisissez une famille d’abord.'); return; }
  if(data.families.length===0){ showToast('Aucune famille configurée.'); return; }
  const famId = ui.activeFamilyId==='all' ? data.families[0].id : ui.activeFamilyId;
  startCotisationSheetFor(famId);
  openSheet();
}

function startCotisationSheetFor(famId){
  const famMembers = data.members.filter(m=>m.familyIds && m.familyIds.includes(famId));
  const famLists = data.lists.filter(l=>l.familyId===famId);
  listMode = famLists.length>0 ? 'existing' : 'new';
  cotisationEntryMode = 'fiche';
  gridListMode = famLists.length>0 ? 'existing' : 'new';
  gridNewListName = '';
  gridSelectedListId = famLists.length>0 ? famLists[0].id : '';
  gridDate = new Date().toISOString().slice(0,10);
  gridRowStatus = {};
  gridNewRows = [];
  renderCotisationShell(famId, famMembers, famLists);
}

function renderCotisationShell(famId, famMembers, famLists){
  $('#sheetContent').innerHTML = `
    <h3>Nouvelle cotisation</h3>
    <div class="field"><label>Famille</label>
      <select id="cotisFamPicker">${data.families.map(f=>`<option value="${f.id}" ${f.id===famId?'selected':''}>${escapeHTML(f.name)}</option>`).join('')}</select>
    </div>
    ${famMembers.length===0 ? '<p class="muted" style="margin-bottom:14px;">Aucun membre dans cette famille pour l’instant — ajoutez-en un dans l’onglet Membres.</p>' : ''}
    <div class="toggle-group">
      <button type="button" id="entrymode_fiche" class="${cotisationEntryMode==='fiche'?'active':''}">En Fiche</button>
      <button type="button" id="entrymode_grille" class="${cotisationEntryMode==='grille'?'active':''}">En Grille</button>
    </div>
    <div id="entryModeZone"></div>
  `;
  $('#cotisFamPicker').onchange = e => { startCotisationSheetFor(e.target.value); };
  $('#entrymode_fiche').onclick = () => { cotisationEntryMode='fiche'; renderCotisationShell(famId, famMembers, famLists); };
  $('#entrymode_grille').onclick = () => { cotisationEntryMode='grille'; renderCotisationShell(famId, famMembers, famLists); };
  if(famMembers.length===0) return;
  if(cotisationEntryMode==='fiche') renderFicheForm(famId, famMembers, famLists);
  else renderGrilleForm(famId, famMembers, famLists);
}

function renderFicheForm(famId, famMembers, famLists){
  const today = new Date().toISOString().slice(0,10);
  const zone = $('#entryModeZone');
  zone.innerHTML = `
    <div class="field"><label>Liste</label>
      <div class="toggle-group">
        <button type="button" id="mode_existing" class="${listMode==='existing'?'active':''}" ${famLists.length===0?'disabled':''}>Liste existante</button>
        <button type="button" id="mode_new" class="${listMode==='new'?'active':''}">Nouvelle liste</button>
      </div>
      <div id="listFieldZone"></div>
    </div>
    <div class="field"><label>Membre</label>
      <select id="f_member">${famMembers.map(m=>`<option value="${m.id}">${escapeHTML(m.prenom+' '+m.nom)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Montant (FCFA)</label><input type="number" id="f_amount" inputmode="decimal" step="1" min="0" placeholder="0"></div>
    <div class="field"><label>Date</label><input type="date" id="f_date" value="${today}"></div>
    <div class="field"><label>Note (optionnel)</label><input type="text" id="f_label" placeholder="ex : versement en espèces"></div>
    <div class="field"><label>Statut</label>
      <select id="f_status"><option value="paid">Payé</option><option value="pending">En attente</option></select>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelSheet">Annuler</button>
      <button class="btn-primary" id="saveSheet">Enregistrer</button>
    </div>
  `;
  function renderListField(){
    const lz = $('#listFieldZone');
    if(listMode==='existing'){
      lz.innerHTML = `<select id="f_list">${famLists.map(l=>`<option value="${l.id}">${escapeHTML(l.name)}</option>`).join('')}</select>`;
    } else {
      lz.innerHTML = `<input type="text" id="f_newlist" placeholder="ex : Cotisation Février 2026">`;
    }
  }
  renderListField();
  $('#mode_existing').onclick = () => { if($('#mode_existing').disabled) return; listMode='existing'; $('#mode_existing').classList.add('active'); $('#mode_new').classList.remove('active'); renderListField(); };
  $('#mode_new').onclick = () => { listMode='new'; $('#mode_new').classList.add('active'); $('#mode_existing').classList.remove('active'); renderListField(); };
  $('#cancelSheet').onclick = closeSheet;
  $('#saveSheet').onclick = () => {
    const amount = parseFloat($('#f_amount').value);
    if(!amount || amount<=0){ showToast('Indiquez un montant valide.'); return; }

      data.lists.push(list);
      listId = list.id;
    } else {
      listId = $('#f_list').value;

    data.cotisations.push({

      date: $('#f_date').value || new Date().toISOString().slice(0,10), label: $('#f_label').value.trim(), status: $('#f_status').value
    });
    saveData(); render(); closeSheet();
    showToast('Cotisation enregistrée.');
  };
}

let gridListMode = 'existing';
let gridNewListName = '';
let gridSelectedListId = '';
let gridDate = '';
let gridRowStatus = {};
let gridNewRows = [];

function renderGrilleForm(famId, famMembers, famLists){
  if(!gridDate) gridDate = new Date().toISOString().slice(0,10);
  famMembers.forEach(m=>{ if(!gridRowStatus[m.id]) gridRowStatus[m.id] = 'paid'; });
  if(gridNewRows.length===0){
    for(let i=0;i<5;i++) gridNewRows.push({ tempId: uid(), nom:'', prenom:'', status:'paid', amount:'' });
  }

  const zone = $('#entryModeZone');
  zone.innerHTML = `
    <div class="field"><label>Liste</label>

    renderGrilleForm(famId, famMembers, famLists);
  };
  $('#cancelSheet').onclick = closeSheet;
  $('#saveGridSheet').onclick = () => {
    let listId;
    const today = new Date().toISOString().slice(0,10);
    if(gridListMode==='new'){
      const name = (gridNewListName || '').trim();
      if(!name){ showToast('Nommez la nouvelle liste.'); return; }
      const list = { id: uid(), familyId: famId, name, createdAt: today };
      data.lists.push(list);
      listId = list.id;
    } else {
      listId = gridSelectedListId || ($('#g_list') ? $('#g_list').value : '');
      if(!listId){ showToast('Choisissez une liste.'); return; }
    }
    const date = gridDate || today;
    let count = 0;

    famMembers.forEach(m=>{
      const val = parseFloat($('#grid_amount_'+m.id).value);
      if(val && val>0){
        data.cotisations.push({ id: uid(), listId, memberId: m.id, amount: val, date, label: '', status: gridRowStatus[m.id] });
        count++;
      }
    });

    let newMembersCreated = 0;
    gridNewRows.forEach(r=>{
      const val = parseFloat(r.amount);
      if(!val || val<=0) return;
      const nom = (r.nom||'').trim(), prenom = (r.prenom||'').trim();
      if(!nom && !prenom){ return; }
      let member = data.members.find(m=>m.familyIds && m.familyIds.includes(famId) && normalizeStr(m.nom)===normalizeStr(nom) && normalizeStr(m.prenom)===normalizeStr(prenom));
      if(!member){
        let code;
        do { code = String(Math.floor(1000+Math.random()*9000)); } while(data.members.some(m=>m.code===code));
        member = { id: uid(), prenom: prenom||'(?)', nom: nom||'(?)', code, familyIds: [famId], status:'active', pendingFamilyIds: [] };
        data.members.push(member);
        newMembersCreated++;
      }
      data.cotisations.push({ id: uid(), listId, memberId: member.id, amount: val, date, label: '', status: r.status });
      count++;
    });

    if(count===0){ showToast('Renseignez au moins un montant.'); return; }
    saveData(); render(); closeSheet();
    showToast(`${count} cotisation(s) enregistrée(s)${newMembersCreated>0 ? `, ${newMembersCreated} nouveau(x) membre(s) créé(s) avec un code temporaire (à modifier dans Mon Profil)` : ''}.`);
  };
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          </div>

      const a = document.createElement('a');

      document.body.appendChild(a); a.click(); a.remove();

      const ev = data.archives.find(e=>e.id===b.dataset.downloadAll);
      b.textContent = 'Préparation…';
      try{
        const zip = new JSZip();
        ev.images.forEach((img,i)=>{
          const base64 = img.data.split(',')[1];
          zip.file(`photo-${i+1}.jpg`, base64, {base64:true});
        });
        const content = await zip.generateAsync({type:'blob'});
        downloadBlob(content, `${ev.name.replace(/[^\w\- ]/g,'')}.zip`);

      b.textContent = '📦 Tout télécharger';
    };

  zone.querySelectorAll('[data-del-photo]').forEach(b=>{
    b.onclick = () => {
      if(!isAdmin(currentMember())){ showToast('Seuls les gestionnaires peuvent supprimer des photos.'); return; }

    };

  zone.querySelectorAll('[data-del-event]').forEach(b=>{
    b.onclick = () => {
      if(!isAdmin(currentMember())){ showToast('Seuls les gestionnaires peuvent supprimer un évènement.'); return; }
      if(confirm('Supprimer tout l’évènement et ses photos ?')){
        data.archives = data.archives.filter(e=>e.id!==b.dataset.delEvent);
        saveData(); render();
      }
    };
  });
  zone.querySelectorAll('[data-rename-event]').forEach(b=>{
    b.onclick = () => {
      if(!isAdmin(currentMember())){ showToast('Seuls les gestionnaires peuvent renommer un évènement.'); return; }
      const ev = data.archives.find(e=>e.id===b.dataset.renameEvent);
      const name = prompt('Nom de l’évènement :', ev.name);
      if(name && name.trim()){ ev.name = name.trim(); saveData(); render(); }
    };
  });
}

function openAddPhotosSheet(eventId){
  $('#sheetContent').innerHTML = `
    <h3>Ajouter des photos</h3>
    <p class="muted" style="margin-bottom:14px;">Les images sont compressées automatiquement avant d’être enregistrées.</p>
    <div class="field"><input type="file" id="photoFiles" accept="image/*" multiple></div>
    <div class="sheet-actions">
      <button class="btn-secondary" id="cancelSheet">Fermer</button>
      <button class="btn-primary" id="uploadBtn">Envoyer</button>
    </div>
  `;
  $('#cancelSheet').onclick = closeSheet;
  $('#uploadBtn').onclick = async () => {
    const files = Array.from($('#photoFiles').files || []);
    if(files.length===0){ showToast('Choisissez au moins une photo.'); return; }
    $('#uploadBtn').textContent = 'Envoi…';
    $('#uploadBtn').disabled = true;
    const ev = data.archives.find(e=>e.id===eventId);
    for(const file of files){
      try{
        const dataUrl = await compressImage(file, 1000, 0.65);
        ev.images.push({ id: uid(), data: dataUrl });
      }catch(err){ console.error(err); }
    }
    await saveData();
    render(); closeSheet();
    showToast(`${files.length} photo(s) ajoutée(s).`);
  };
  openSheet();
}

/* ================= SUGGESTIONS / BOÎTE ================= */
function adminMembers(){ return data.members.filter(m=>isAdmin(m)); }

function renderSuggestions(){
  const el = $('#suggestionsInner');
  if(!el) return;
  const me = currentMember();
  const admins = adminMembers();

  el.innerHTML = `
    <h2 class="section-title">Suggestions</h2>
    <p class="muted" style="margin-bottom:14px;">Écrivez un message à l’un des gestionnaires — il arrivera dans sa Boîte. Vous pouvez aussi vous l’envoyer à vous-même comme pense-bête.</p>
    ${admins.length===0 ? emptyState('📭','Aucun gestionnaire inscrit pour l’instant','') : `
      <div class="field"><label>Destinataire</label>
        <select id="sug_recipient">${admins.map(a=>`<option value="${a.id}">${escapeHTML(a.prenom+' '+a.nom)}${me && a.id===me.id ? ' (moi-même)' : ''}</option>`).join('')}</select>
      </div>
      <div class="field"><textarea id="sug_text" rows="4" placeholder="Votre suggestion…" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--paper-line);background:var(--paper-light);font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);resize:vertical;"></textarea></div>
      <button class="dashed-btn" id="sendSuggestionBtn" style="margin-bottom:18px;">✉️ Envoyer</button>
      <div id="mySuggestionsList"></div>
    `}
  `;
  if(admins.length===0) return;

  if(me){
    const mine = data.suggestions.filter(s=>s.senderId===me.id).sort((a,b)=>b.date.localeCompare(a.date));
    if(mine.length>0){
      const listEl = $('#mySuggestionsList');
      listEl.insertAdjacentHTML('beforeend', `<div class="fam-tag">Vos envois</div>`);
      listEl.insertAdjacentHTML('beforeend', mine.map(s=>`
        <div class="suggestion-card">
          <div class="sug-meta">À ${escapeHTML(s.recipientName)} · ${new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}</div>
          <div class="sug-text">${escapeHTML(s.text)}</div>
        </div>`).join(''));
    }
  }

  $('#sendSuggestionBtn').onclick = () => {
    if(!me){ showToast('Connectez-vous d’abord.'); return; }
    const text = $('#sug_text').value.trim();
    if(!text){ showToast('Écrivez votre suggestion avant d’envoyer.'); return; }
    const recipientId = $('#sug_recipient').value;
    const recipient = data.members.find(m=>m.id===recipientId);
    data.suggestions.push({
      id: uid(), senderId: me.id, senderName: `${me.prenom} ${me.nom}`,
      recipientId, recipientName: `${recipient.prenom} ${recipient.nom}`,
      text, date: new Date().toISOString(), lu: false
    });
    saveData(); render();
    showToast(`Envoyé à ${recipient.prenom} ${recipient.nom}.`);
  };
}

function renderBoite(){
  const el = $('#boiteInner');
  const me = currentMember();

  updateBoiteBadge(me);

  if(!el) return;
  if(!me){
    el.innerHTML = emptyState('🔒','Connectez-vous','Connectez-vous pour voir vos messages reçus.');
    return;
  }
  const received = data.suggestions.filter(s=>s.recipientId===me.id).sort((a,b)=>b.date.localeCompare(a.date));

  el.innerHTML = `<h2 class="section-title">Boîte de réception de ${escapeHTML(me.prenom)}</h2>`;
  if(received.length===0){
    el.insertAdjacentHTML('beforeend', emptyState('📭','Boîte vide','Les suggestions qui vous sont envoyées apparaîtront ici.'));
    return;
  }
  el.insertAdjacentHTML('beforeend', received.map(s=>`
    <div class="suggestion-card" data-msg-card="${s.id}">
      <div class="sug-meta">De ${escapeHTML(s.senderName)}${s.senderId===me.id?' (vous-même)':''} · ${new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}${!s.lu ? ' · <span class="tab-badge">nouveau</span>' : ''}
        <button class="del-btn" data-del-sug="${s.id}" title="Supprimer" style="float:right;">✕</button>
      </div>
      ${s.lu
        ? `<div class="sug-text">${escapeHTML(s.text)}</div>
           <button class="dashed-btn" data-reply="${s.id}" style="margin-top:10px;padding:9px;font-size:12.5px;">↩ Répondre</button>
           <div id="replyZone-${s.id}" style="display:none;margin-top:8px;">
             <textarea id="replyText-${s.id}" rows="3" placeholder="Votre réponse…" style="width:100%;padding:9px 10px;border-radius:8px;border:1.5px solid var(--paper-line);background:var(--paper);font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);resize:vertical;margin-bottom:8px;"></textarea>
             <button class="btn-primary" data-send-reply="${s.id}" style="width:100%;padding:10px;border-radius:10px;border:none;font-weight:600;font-size:13px;cursor:pointer;">Envoyer la réponse</button>
           </div>`
        : `<div class="sug-text" data-open-msg="${s.id}" style="cursor:pointer;color:var(--brass);font-weight:600;">Cliquez pour lire le message…</div>`
      }
    </div>`).join(''));

  el.querySelectorAll('[data-open-msg]').forEach(d=>{
    d.onclick = () => {
      const s = data.suggestions.find(x=>x.id===d.dataset.openMsg);
      s.lu = true;
      saveData(); render();
    };
  });

  el.querySelectorAll('[data-del-sug]').forEach(b=>{
    b.onclick = () => {
      data.suggestions = data.suggestions.filter(s=>s.id!==b.dataset.delSug);
      saveData(); render();
    };
  });
  el.querySelectorAll('[data-reply]').forEach(b=>{
    b.onclick = () => {
      const zone = $('#replyZone-'+b.dataset.reply);
      zone.style.display = zone.style.display==='none' ? 'block' : 'none';
    };
  });
  el.querySelectorAll('[data-send-reply]').forEach(b=>{
    b.onclick = () => {
      const original = data.suggestions.find(s=>s.id===b.dataset.sendReply);
      const textarea = $('#replyText-'+b.dataset.sendReply);
      const text = textarea.value.trim();
      if(!text){ showToast('Écrivez votre réponse avant d’envoyer.'); return; }
      data.suggestions.push({
        id: uid(), senderId: me.id, senderName: `${me.prenom} ${me.nom}`,
        recipientId: original.senderId, recipientName: original.senderName,
        text, date: new Date().toISOString(), lu: false
      });
      saveData(); render();
      showToast(`Réponse envoyée à ${original.senderName}.`);
    };
  });
}

function updateBoiteBadge(me){
  const badge = $('#boiteBadge');
  if(!badge) return;
  if(!me){ badge.style.display='none'; return; }
  const count = data.suggestions.filter(s=>s.recipientId===me.id && !s.lu).length;
  if(count>0){ badge.textContent = count; badge.style.display='inline-block'; }
  else { badge.style.display='none'; }
}

/* ================= MON PROFIL ================= */
function renderProfil(){
  const el = $('#profilInner');
  if(!el) return;
  const me = currentMember();
  if(!me){
    el.innerHTML = emptyState('🔒','Connectez-vous','Connectez-vous pour voir votre profil.');
    return;
  }
  const amAdmin = isAdmin(me);
  el.innerHTML = `
    <h2 class="section-title">Mon Profil</h2>
    <div class="field"><label>Prénom</label><input type="text" id="p_prenom" value="${escapeHTML(me.prenom)}"></div>
    <div class="field"><label>Nom</label><input type="text" id="p_nom" value="${escapeHTML(me.nom)}"></div>
    <div class="field"><label>Famille(s)</label>
      ${amAdmin
        ? familyCheckboxesHTML('p_fam', me.familyIds||[])
        : `<p class="muted">${(me.familyIds||[]).length>0 ? data.families.filter(f=>me.familyIds.includes(f.id)).map(f=>escapeHTML(f.name)).join(', ') : 'Aucune'} — pour changer, écrivez à un administrateur dans Suggestions.</p>`}
    </div>
    <div class="field"><label>Mot de passe (code personnel)</label>${passwordFieldHTML('p_code', me.code, '')}</div>
    <button class="dashed-btn" id="saveProfilBtn">Enregistrer les modifications</button>
  `;
  wirePasswordToggles();
  $('#saveProfilBtn').onclick = () => {
    const prenom = $('#p_prenom').value.trim();
    const nom = $('#p_nom').value.trim();
    const code = $('#p_code').value.trim();
    if(!prenom || !nom){ showToast('Indiquez votre nom et prénom.'); return; }
    if(!code){ showToast('Choisissez un mot de passe.'); return; }
    if(data.members.some(x=>x.code===code && x.id!==me.id)){ showToast('Ce mot de passe est déjà utilisé par quelqu’un d’autre.'); return; }
    me.prenom = prenom; me.nom = nom; me.code = code;
    if(amAdmin){ me.familyIds = getCheckedFamilyIds('p_fam'); }
    saveData(); render();
    $('#userline').textContent = `Connecté(e) : ${me.prenom} ${me.nom}${isAdmin(me) ? ' · gestionnaire' : ' · lecture seule'}`;
    showToast('Profil mis à jour.');
  };
}

function closeSheet(){ $('#overlay').classList.remove('active'); }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });
$('#fabBtn').onclick = openAddCotisationSheet;

loadData();
